<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Hábitos</title>
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="h2 mb-4">Tablero de Hábitos</h1>
        <form id="habit-form" class="row g-3 align-items-end mb-4">
            <div class="col-md-8">
                <label for="habit-name" class="form-label">Nombre del hábito</label>
                <input type="text" class="form-control" id="habit-name" placeholder="Ej. Beber 8 vasos de agua">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary w-100">Agregar</button>
            </div>
        </form>
        <ul id="habit-list" class="list-group"></ul>
    </div>
    <script src="logic.js"></script>
</body>
</html>
