<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Hábitos</title>
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container py-5">
        <div class="tablero">
            <header class="tablero-header">
                <img src="assets/icon.png" alt="Icono del tablero" class="tablero-icono">
                <div>
                    <p class="tablero-etiqueta mb-1">Hoy</p>
                    <h1 class="tablero-titulo">Tablero de Hábitos</h1>
                    <p class="tablero-subtitulo mb-0">Marca tu día, un hábito a la vez.</p>
                </div>
            </header>

            <form id="habit-form" class="row g-3 align-items-end tablero-form">
                <div class="col-md-8">
                    <label for="habit-name" class="form-label">Nombre del hábito</label>
                    <input type="text" class="form-control" id="habit-name" placeholder="Ej. Beber 8 vasos de agua">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-agregar w-100">Agregar</button>
                </div>
            </form>

            <ul id="habit-list" class="list-group habit-list"></ul>
        </div>
    </div>
    <script src="logic.js"></script>
</body>
</html>
